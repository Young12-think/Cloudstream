name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build Plugins
        working-directory: ${{ github.workspace }}/src/plugin
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon --stacktrace

          shopt -s nullglob
          files=(**/build/*.cs3)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no .cs3 files produced"
            exit 1
          fi
          rm -f "${GITHUB_WORKSPACE}/builds"/*.cs3 || true
          cp "${files[@]}" "${GITHUB_WORKSPACE}/builds/"
          cp build/plugins.json "${GITHUB_WORKSPACE}/builds/"
          cat << 'EOF' > "${GITHUB_WORKSPACE}/builds/repo.json"
          {
            "name": "Cloudstream ID",
            "description": "Koleksi plugin film dan anime subtitle Indonesia",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/Young12-think/Cloudstream/builds/plugins.json"
            ]
          }
          EOF

          echo "Built packages:"
          ls -la "${GITHUB_WORKSPACE}/builds"/*.cs3

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ github.sha }}
          path: |
            builds/*.cs3
            builds/plugins.json
            builds/repo.json
          if-no-files-found: error
          retention-days: 14

      - name: Push builds branch
        working-directory: ${{ github.workspace }}/builds
        run: |
          set -euo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
            echo "Nothing to commit on builds branch."
            exit 0
          fi

          git commit -m "Build ${GITHUB_SHA}"
          git push origin HEAD:builds
